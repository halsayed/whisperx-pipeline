# Optional: a minimal in-cluster registry for labs that have none.
#
# Nodes pull from it as  localhost:30500/<image>  (containerd allows plain HTTP
# for localhost, so no node configuration is needed). Builds push to it by its
# service name. No auth, no TLS: do not use outside a lab. If you have a real
# registry, skip this file and push the image there instead.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lab-registry
  namespace: whisperx
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 40Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-registry
  namespace: whisperx
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: lab-registry }
  template:
    metadata:
      labels: { app: lab-registry }
    spec:
      containers:
        - name: registry
          image: registry:2
          ports: [{ containerPort: 5000 }]
          env:
            - { name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true" }
          volumeMounts: [{ name: data, mountPath: /var/lib/registry }]
          readinessProbe:
            httpGet: { path: /v2/, port: 5000 }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: lab-registry }
---
apiVersion: v1
kind: Service
metadata:
  name: lab-registry
  namespace: whisperx
spec:
  type: NodePort
  selector: { app: lab-registry }
  ports:
    - { port: 5000, targetPort: 5000, nodePort: 30500 }
